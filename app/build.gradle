plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ashil812.shkarboursepro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ashil812.shkarboursepro'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation 'androidx.work:work-runtime-ktx:2.10.1'

}
